name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'content/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# configure-pages needs pages:write to turn Pages on the first time.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild bundle.json from the catalog
        run: python3 site/make_bundle.py

      - name: Fail if the bundle drifted from the committed one
        run: git diff --exit-code -- site/public/content/bundle.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The shared primitives come from zhangqi444/ui as a git dependency, and npm
      # canonicalises every GitHub URL to git+ssh:// in the lockfile whatever form
      # package.json used. A runner has no SSH key, so npm ci would have to fall
      # back to https on its own. It does — but the failure mode is the deploy
      # stopping rather than anything visible in a test, so it is made explicit.
      # The repo is public, so no credential is involved.
      - name: Fetch git dependencies over https, not ssh
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install and build (Vite + React + Tailwind + shadcn/ui)
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
